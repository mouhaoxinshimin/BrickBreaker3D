<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E4F2FF">
<title>打砖块 · Neon Breaker</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="app">

  <!-- 顶部 HUD -->
  <div id="hud">
    <div class="stat">
      <div class="label">分数</div>
      <div class="val" id="score">0</div>
    </div>

    <div id="titleBox">
      <div id="title">打砖块</div>
      <span id="levelTag">第 1 / 6 关</span>
    </div>

    <div class="stat right">
      <div class="label">生命</div>
      <div id="lives"></div>
      <div class="label" style="margin-top:5px">最高 <span id="best">0</span></div>
    </div>
  </div>

  <!-- 提示 -->
  <div id="hint">拖动鼠标 / 手指移动挡板 · 点击发射球</div>

  <!-- 全屏闪光层 -->
  <div id="flash"></div>

  <!-- 底部操作：图标全部换成扁平线性 SVG，跟着文字色走，不再用彩色 emoji -->
  <div id="controls">
    <div class="toggle on" id="tgSound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h3l5 4V5l-5 4H4z"/><path d="M16.5 8.5a4.6 4.6 0 0 1 0 7"/></svg>
      <span>音效</span>
    </div>
    <div class="toggle on" id="tgVibrate">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.4"/><path d="M3.4 8.5v7M20.6 8.5v7"/></svg>
      <span>震动</span>
    </div>
    <div class="toggle" id="tgShake">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4.6" width="14" height="11.4" rx="2"/><path d="M9 21h6"/><path d="M1.9 8a4.4 4.4 0 0 0 0 6"/><path d="M22.1 8a4.4 4.4 0 0 1 0 6"/></svg>
      <span>震屏</span>
    </div>
    <div class="iconBtn" id="tgOrient">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 0 1 12.6-5.4"/><path d="M19.5 12a7.5 7.5 0 0 1-12.6 5.4"/><path d="M17.6 3.4v3.4h-3.4"/><path d="M6.4 20.6v-3.4h3.4"/></svg>
      <span id="tgOrientText">横屏</span>
    </div>
    <div class="iconBtn" id="tgBoard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8v5.5a4 4 0 0 1-8 0V3.5z"/><path d="M8 5H5a3 3 0 0 0 3 3.2"/><path d="M16 5h3a3 3 0 0 1-3 3.2"/><path d="M12 13.5v4.2"/><path d="M8.6 20.5h6.8"/></svg>
      <span>排行</span>
    </div>
  </div>

  <!-- 开始 / 结束覆盖层 -->
  <div id="overlay">
    <h1 id="ovTitle">打砖块</h1>
    <p id="ovDesc">击碎所有砖块通关<br>挡板边缘命中可以改变反弹角度 · 共 6 关</p>

    <div class="score-final" id="ovScore" style="display:none"></div>
    <div id="ovRank" style="display:none"></div>

    <div class="picker">
      <div class="pickerRow">
        <div class="pickerLabel">难度</div>
        <div class="seg" id="diffSeg"></div>
      </div>
      <div class="pickerRow">
        <div class="pickerLabel">球速</div>
        <div class="seg" id="speedSeg"></div>
      </div>
      <div id="diffStat"></div>
      <div id="diffDesc"></div>
    </div>

    <div id="nameWrap">
      <input id="nameInput" type="text" maxlength="12" placeholder="输入你的名字" autocomplete="off" spellcheck="false">
    </div>

    <button class="btn" id="startBtn">开始游戏</button>
  </div>

  <!-- 排行榜 -->
  <div id="board" class="hidden">
    <h2>🏆 排行榜 · 前 10 名</h2>
    <div class="boardList" id="boardList"></div>
    <button class="btn ghost" id="boardClose">返回</button>
    <p class="boardFoot">纪录保存在本机 · 换设备不会同步</p>
  </div>

</div>

<script src="assets/vendor/three.min.js"></script>
<script src="assets/js/sound.js"></script>
<script src="assets/js/scores.js"></script>
<script src="assets/js/fx.js"></script>
<script src="assets/js/game.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
